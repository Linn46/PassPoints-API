<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f2" />
    <meta
      name="description"
      content="Passpoints, autenticación gráfica segura."
    />
    <title>Passpoints | Autenticación gráfica</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/account.css" />
  </head>
  <body>
    <div class="page-background" aria-hidden="true">
      <span class="background-shape shape-one"></span>
      <span class="background-shape shape-two"></span>
      <span class="background-shape shape-three"></span>
    </div>

    <div class="app-shell">
      <header class="site-header">
        <a href="#auth-view" class="brand" aria-label="Passpoints, inicio">
          <span class="brand-symbol" aria-hidden="true"
            ><i></i><i></i><i></i><i></i><i></i
          ></span>
          <span class="brand-name">passpoints</span>
        </a>
        <div class="header-actions">
          <span class="header-description">Autenticación gráfica</span>
          <input
            id="theme-switch"
            class="theme-switch"
            type="checkbox"
            aria-label="Usar tema oscuro"
          />
          <label
            id="theme-toggle"
            class="theme-toggle"
            for="theme-switch"
            title="Cambiar tema"
            aria-label="Cambiar a modo oscuro"
          >
            <span class="theme-icon" aria-hidden="true">☾</span>
          </label>
        </div>
      </header>

      <main id="app" aria-live="polite">
        <section
          id="auth-view"
          class="auth-view"
          aria-label="Autenticación"
          data-view="auth"
        ></section>
        <section
          id="home-view"
          class="home-view"
          aria-label="Inicio"
          data-view="home"
          hidden
        ></section>
      </main>

      <footer class="site-footer">
        <span>PASSPOINTS</span>
        <span>Proyecto de investigación en seguridad gráfica</span>
      </footer>
    </div>

    <script src="js/api.js?v=4"></script>
    <script src="js/image-selector.js?v=5"></script>
    <script src="js/point-selector.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/home.js?v=5"></script>
    <script src="js/account.js?v=5"></script>
    <script src="js/app.js?v=6"></script>
  </body>
</html>
